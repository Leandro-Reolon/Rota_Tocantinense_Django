{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-4">Atualizar Meu Perfil</h2>
            {% if msg %}
                <div class="alert alert-success">{{ msg }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="nome" class="form-control" placeholder="Nome" value="{{ user.first_name }}" required>
                </div>
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Usuário" value="{{ user.username }}" required>
                </div>
                <div class="mb-3">
                    <input type="email" name="email" class="form-control" placeholder="E-mail" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <input type="text" name="endereco" class="form-control" placeholder="Endereço" value="{{ user.endereco|default:'' }}">
                </div>
                <button type="submit" class="btn btn-primary w-100">Salvar</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'logout' %}" class="btn btn-danger w-100">Logout</a>
            </div>
            <div class="mb-3 text-center">
                <a href="{% url 'inicio' %}" class="btn btn-secondary w-100">Voltar</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-light py-4">
        <div class="container text-center">
            <p>© Rota Tocantinense</p>
        </div>
    </footer>

</body>
</html>
