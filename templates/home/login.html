{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Rota Tocantinense</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-4">Login</h2>
            {% if erro %}
                <div class="alert alert-danger">{{ erro }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Usuário" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Senha" required>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="lgpd" id="lgpd" required>
                    <label class="form-check-label" for="lgpd">
                        Li e aceito os <a href="https://www.gov.br/esporte/pt-br/acesso-a-informacao/lgpd" target="_blank">termos da LGPD</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div class="mt-3 text-center">
                <span>Não tem uma conta?</span>
                <a href="{% url 'cadastro' %}">Cadastre-se aqui</a>
            </div>
            <div class="mt-3 text-center">
                <a href="{% url 'inicio' %}" class="btn btn-secondary w-100">Voltar</a>
            </div>
        </div>
    </div>
</body>
</html>
