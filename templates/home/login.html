{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Rota Tocantinense</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-gradient-primary">
    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div class="card shadow p-4 p-md-5" style="width: 100%; max-width: 450px; border-radius: 15px;">
            <div class="text-center mb-4">
                <img src="{% static 'img/logo.png' %}" alt="Logo Rota Tocantinense" class="img-fluid" style="max-height: 80px;">
                <h2 class="mt-3 fw-bold text-primary">Bem-vindo de volta!</h2>
            </div>
            {% if erro %}
                <div class="alert alert-danger text-center" role="alert">
                    {{ erro }}
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="floatingUsername" placeholder="Nome de Usuário" required>
                    <label for="floatingUsername">Nome de Usuário</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Senha" required>
                    <label for="floatingPassword">Senha</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="lgpd" id="lgpd" required>
                    <label class="form-check-label" for="lgpd">
                        Li e aceito os <a href="https://www.gov.br/esporte/pt-br/acesso-a-informacao/lgpd" target="_blank" class="text-primary fw-bold">termos da LGPD</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar</button>
            </form>
            <div class="mt-4 text-center">
                <p class="mb-0">Não tem uma conta? <a href="{% url 'cadastro' %}" class="text-primary fw-bold">Cadastre-se aqui</a></p>
            </div>
            <div class="mt-3 text-center">
                <a href="{% url 'inicio' %}" class="btn btn-outline-secondary w-100 py-2">Voltar à Página Inicial</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-light py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; {% now "Y" %} Rota Tocantinense. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
</html>
