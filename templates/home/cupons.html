{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cupons de Desconto</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Cupons de Desconto</h2>
            <a href="{% url 'inicio' %}" class="btn btn-secondary">Voltar</a>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for cupom in cupons %}
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title text-success fw-bold">{{ cupom.titulo }}</h5>
                            <p class="card-text">{{ cupom.descricao }}</p>
                        </div>
                        <div class="d-flex align-items-center mt-3">
                            <input type="text" class="form-control me-2 text-center fw-bold" value="{{ cupom.codigo }}" id="cupom{{ forloop.counter }}" readonly style="max-width: 120px;">
                            <button class="btn btn-outline-primary" onclick="copiarCupom('cupom{{ forloop.counter }}')">Copiar</button>
                        </div>
                    </div>
                    <div class="card-footer text-muted text-end">
                        Expira em: {{ cupom.validade|date:"d/m/Y" }}
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="text-center">Nenhum cupom disponível no momento.</p>
            {% endfor %}
        </div>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
